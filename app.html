        </div>
        <div style={{fontWeight:800,fontSize:20,marginBottom:8}}>No Activity Yet</div>
        <p style={{color:"#6b7280",fontSize:13,lineHeight:1.8,maxWidth:400,margin:"0 auto 20px"}}>Activity tracks all your projects and change requests. Create a project to get started.</p>
        <button className="btn-p" style={{marginTop:24,padding:"10px 24px",fontSize:12}} onClick={()=>setView("np")}>+ Create First Project</button>
      </div>
    );
  }

  return(
    <div className="fade" style={{padding:"24px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:24}}>
        <h2 style={{fontWeight:800,fontSize:22,margin:0}}>Activity</h2>
        <div style={{fontSize:12,color:"var(--muted)"}}>{timelineItems.length} events</div>
      </div>
      
      {timelineItems.length===0?(
        <div style={{textAlign:"center",padding:"40px",color:"var(--muted)"}}>
          <div style={{fontSize:40,marginBottom:12}}>📭</div>
          <div>No activity recorded yet</div>
        </div>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:0}}>
          {timelineItems.map((item,idx)=>(
            <div key={idx} style={{display:"flex",gap:14,padding:"14px 0",borderBottom:"1px solid var(--border)",alignItems:"flex-start"}}>
              <div style={{width:36,height:36,borderRadius:"50%",background:"var(--surface2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>
                {item.icon}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <span style={{fontWeight:600,fontSize:13}}>{item.title}</span>
                  {item.status&&(
                    <span style={{fontSize:10,fontWeight:600,padding:"2px 8px",borderRadius:10,background:item.color+"20",color:item.color}}>
                      {item.status.toUpperCase()}
                    </span>
                  )}
                </div>
                <div style={{fontSize:11,color:"var(--muted)",marginTop:2}}>
                  {item.project&&<span>{item.project} · </span>}
                  {item.subtitle}
                </div>
              </div>
              <div style={{fontSize:10,color:"var(--muted2)",whiteSpace:"nowrap",flexShrink:0}}>
                {getTimeAgo(item.date)}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}


function GanttChart({proj,crs}){
  const created  = new Date(proj.created_at||proj.createdAt||Date.now());
  const dueRaw   = proj.due_date||proj.dueDate;
  const due      = dueRaw ? new Date(dueRaw) : new Date(created.getTime()+30*24*60*60*1000);
  const today    = new Date();
  const totalMs  = Math.max(due - created, 1);

  function pct(d){ return Math.max(0,Math.min(100,((new Date(d)-created)/totalMs)*100)); }

  const cols = [];
  let c = new Date(created); c.setDate(c.getDate() - c.getDay());
  while(c <= due){
    cols.push(new Date(c));
    c.setDate(c.getDate()+7);
  }
  const colCount = Math.max(cols.length,4);

  const monthGroups = [];
  cols.forEach((col,i)=>{
    const key = `${col.getFullYear()}-${col.getMonth()}`;
    const last = monthGroups[monthGroups.length-1];
    if(last && last.key===key){ last.span++; }
    else monthGroups.push({key, label: col.toLocaleString("default",{month:"short",year:"2-digit"}), span:1, startCol:i});
  });

  function dateToCol(d){
    const dt = new Date(d);
    for(let i=cols.length-1;i>=0;i--){
      if(dt >= cols[i]) return i;
    }
    return 0;
  }
  function dateEndCol(d, hours){
    const days = hours ? Math.max(1,hours/8) : 3;
    const end = new Date(new Date(d).getTime() + days*24*60*60*1000);
    return Math.min(colCount-1, dateToCol(end)+1);
  }

  const statusColor  = {approved:"#0EA5E9", pending:"#F59E0B", rejected:"#EF4444"};
  const statusBg     = {approved:"rgba(124,58,237,0.15)", pending:"rgba(245,158,11,0.15)", rejected:"rgba(239,68,68,0.1)"};
  const todayCol     = dateToCol(today);

  const colW = 36;
  const labelW = 160;

  const rows = [
    {label:"Project Baseline", color:"#7C3AED", bg:"rgba(124,58,237,0.2)", startCol:0, endCol:colCount, status:"baseline"},
    ...crs.filter(c=>c.status!=="rejected").map(cr=>({
      label: cr.title||cr.description||"Change Request",
      color: statusColor[cr.status]||"#818CF8",
      bg: statusBg[cr.status]||"rgba(129,140,248,0.15)",
      startCol: dateToCol(cr.created_at||cr.createdAt||created),
      endCol: dateEndCol(cr.created_at||cr.createdAt||created, cr.hours),
      status: cr.status,
      hours: cr.hours,
    }))
  ];

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontSize:10,letterSpacing:"0.1em",color:"var(--primary)",fontFamily:"'IBM Plex Mono',monospace",opacity:0.9}}>{/* GANTT CHART */}</div>
        <div style={{display:"flex",gap:12}}>
          {[["#7C3AED","Baseline"],["#0EA5E9","Approved"],["#F59E0B","Pending"],["var(--teal)","Today"]].map(([c,l])=>(
            <div key={l} style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"var(--muted)",fontFamily:"'IBM Plex Mono',monospace"}}>
              <div style={{width:10,height:10,borderRadius:2,background:c,flexShrink:0}}/>
              {l}
            </div>
          ))}
        </div>
      </div>

      <div style={{overflowX:"auto"}}>
        <div style={{minWidth:labelW + colCount*colW}}>

          <div style={{display:"grid",gridTemplateColumns:`${labelW}px repeat(${colCount},${colW}px)`,borderBottom:"2px solid var(--border)",marginBottom:0}}>
            <div style={{padding:"6px 10px",fontSize:10,fontWeight:700,color:"var(--muted2)",fontFamily:"'IBM Plex Mono',monospace",borderRight:"1px solid var(--border)",background:"var(--surface2)"}}>
              TASK NAME
            </div>
            {monthGroups.map((mg,i)=>(
              <div key={i} style={{
                gridColumn:`span ${mg.span}`,
                textAlign:"center",padding:"6px 4px",
                fontSize:10,fontWeight:700,
                color:"var(--muted2)",fontFamily:"'IBM Plex Mono',monospace",
                background:"var(--surface2)",
                borderRight:"1px solid var(--border)",
              }}>
                {mg.label.toUpperCase()}
              </div>
            ))}
          </div>

          <div style={{display:"grid",gridTemplateColumns:`${labelW}px repeat(${colCount},${colW}px)`,borderBottom:"1px solid var(--border)",background:"var(--surface2)"}}>
            <div style={{borderRight:"1px solid var(--border)"}}/>
            {cols.map((col,i)=>(
              <div key={i} style={{
                textAlign:"center",padding:"3px 2px",
                fontSize:9,color:i===todayCol?"var(--teal)":"var(--muted)",
                fontFamily:"'IBM Plex Mono',monospace",
                fontWeight:i===todayCol?700:400,
                background:i===todayCol?"rgba(124,58,237,0.06)":"transparent",
                borderRight:"1px solid rgba(30,36,64,0.5)",
              }}>
                {col.getDate()}
              </div>
            ))}
          </div>

          {rows.map((row,ri)=>(
            <div key={ri} style={{
              display:"grid",
              gridTemplateColumns:`${labelW}px repeat(${colCount},${colW}px)`,
              borderBottom:"1px solid var(--border)",
              minHeight:40,
            }}>
              <div style={{
                padding:"0 10px",display:"flex",alignItems:"center",
                fontSize:11,color:"var(--text)",
                fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",
                borderRight:"1px solid var(--border)",
              }}>
                <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:labelW-20}}>
                  {row.label}
                </span>
              </div>

              {cols.map((col,ci)=>{
                const isBarStart = ci===row.startCol;
                const isInBar    = ci>=row.startCol && ci<row.endCol;
                const isToday    = ci===todayCol;
                return(
                  <div key={ci} style={{
                    position:"relative",
                    borderRight:"1px solid rgba(30,36,64,0.4)",
                    background:isToday?"rgba(124,58,237,0.04)":isInBar?row.bg:"transparent",
                    display:"flex",alignItems:"center",
                  }}>
                    {isBarStart&&(
                      <div style={{
                        position:"absolute",
                        left:2,
                        width:(row.endCol-row.startCol)*colW - 4,
                        height:22,
                        borderRadius:4,
                        background:row.color,
                        display:"flex",alignItems:"center",
                        padding:"0 8px",
                        fontSize:9,fontWeight:700,color:"#fff",
                        fontFamily:"'IBM Plex Mono',monospace",
                        overflow:"hidden",whiteSpace:"nowrap",
                        zIndex:2,
                      }}>
                        {row.hours?`${row.hours}h`:row.status==="baseline"?"Baseline":""}
                      </div>
                    )}
                    {isToday&&(
                      <div style={{
                        position:"absolute",left:"50%",transform:"translateX(-50%)",
                        top:0,bottom:0,width:2,
                        background:"var(--teal)",zIndex:3,
                      }}/>
                    )}
                  </div>
                );
              })}
            </div>
          ))}

          {rows.length===1&&(
            <div style={{
              gridColumn:`1 / ${colCount+2}`,
              textAlign:"center",padding:"16px",
              color:"var(--muted)",fontSize:12,
            }}>
              No approved Change Requests yet — approve a CR to see it plotted on the timeline.
            </div>
          )}

        </div>
      </div>
    </div>
  );
}


function ReadOnlyView({data}){
  const {id, clientCan="comment", brand={}} = data;
  const [proj, setProj] = useState(null);
  const [loading, setLoading] = useState(true);
  const [author, setAuthor] = useState("");
  const [toast, setToast] = useState(null);
  const [processing, setProcessing] = useState(false);
  const [showRejectModal, setShowRejectModal] = useState(null);
  const [rejectReason, setRejectReason] = useState("");
  const [showCommentModal, setShowCommentModal] = useState(null);
  const [commentText, setCommentText] = useState("");
  const [crs, setCrs] = useState([]);
  const ac = brand.color || "#F59E0B";

  const canView = true;
  const canComment = clientCan === "comment" || clientCan === "approve";
  const canApprove = clientCan === "approve";

  const handleApprove = async(crId) => {
    if(!isConfigured || processing) return;
    setProcessing(true);
    try{
      const now = new Date().toISOString();
      await supabase.from("change_requests").update({status:"approved",client_approved_by:"Client",client_approved_at:now}).eq("id",crId);
      setCrs(crs.map(c=>c.id===crId?{...c,status:"approved",client_approved_by:"Client",client_approved_at:now}:c));
      setToast("✅ Approved!");
      setTimeout(()=>setToast(null),2000);
    }catch(e){setToast("Error: "+e.message);}
    setProcessing(false);
  };

  const handleReject = async(crId) => {
    if(!isConfigured || processing || !rejectReason.trim()) return;
    setProcessing(true);
    try{
      await supabase.from("change_requests").update({status:"rejected",client_dispute_reason:rejectReason}).eq("id",crId);
      setCrs(crs.map(c=>c.id===crId?{...c,status:"rejected",client_dispute_reason:rejectReason}:c));
      setShowRejectModal(null);
      setRejectReason("");
      setToast("❌ Rejected");
      setTimeout(()=>setToast(null),2000);
    }catch(e){setToast("Error: "+e.message);}
    setProcessing(false);
  };

  const handleAddComment = async(crId) => {
    if(!isConfigured || processing || !commentText.trim()) return;
    setProcessing(true);
    try{
      const newComment = {author:"Client",text:commentText,date:new Date().toISOString()};
      const cr = crs.find(c=>c.id===crId);
      const comments = cr?.comments||[];
      await supabase.from("change_requests").update({comments:[...comments,newComment]}).eq("id",crId);
      
      // Create notification for project owner
      if(cr?.project_id){
        await supabase.from("notifications").insert({
          user_id:cr.project_id, // This won't work - need project owner ID
          type:"cr_comment",
          title:"New Comment",
          body:commentText.slice(0,100),
          project_id:cr.project_id,
          cr_id:crId
        });
      }
      
      setCrs(crs.map(c=>c.id===crId?{...c,comments:[...comments,newComment]}:c));
      setShowCommentModal(null);
      setCommentText("");
      setToast("💬 Comment added");
      setTimeout(()=>setToast(null),2000);
    }catch(e){setToast("Error: "+e.message);}
    setProcessing(false);
  };

  useEffect(()=>{
    if(!id){setLoading(false);return;}
    if(!isConfigured){
      setProj(data.project);
      setLoading(false);
      return;
    }
    (async()=>{
      try{
        const{data:p,error}=await supabase.from("projects").select("*").eq("id",id).single();
        if(error||!p){setLoading(false);return;}
        const{data:crsData}=await supabase.from("change_requests").select("*").eq("project_id",id).order("created_at",{ascending:false});
        const mappedCRs = (crsData||[]).map(c=>({...c,requestedBy:c.requested_by,createdAt:c.created_at,comments:c.comments||[]}));
        setProj({...p,changeRequests:mappedCRs});
        setCrs(mappedCRs);
      }catch(e){}
      setLoading(false);
    })();
  },[id]);

  if(loading)return<div style={{padding:60,textAlign:"center"}}>Loading…</div>;
  if(!proj)return<div style={{padding:60,textAlign:"center"}}>Project not found</div>;

  const approvedCRs=crs.filter(c=>c.status==="approved");
  const pendingCRs=crs.filter(c=>c.status==="pending");
  const tasks=proj?.tasks||(proj.baseline?(()=>{
    const lines=proj.baseline.split("\n").filter(l=>l.trim());
    const inLines=lines.filter(l=>/^(✅|IN:|in:|included|✓|•|- )/i.test(l.trim())||l.toLowerCase().includes(" in:")||l.startsWith("•")||l.startsWith("-"));
    return inLines.map((line,i)=>({
      id:`auto_${i}`,
      name:line.replace(/^(✅|IN:|in:|included|✓|\s*•\s*|\s*-\s*)/i,"").trim(),
      status:"not_started",
      source:"baseline"
    }));
  })():[]);
  const doneTasks=tasks.filter(t=>t.status==="done").length;
  const taskPct=tasks.length>0?Math.round((doneTasks/tasks.length)*100):0;

  return(
    <div style={{minHeight:"100vh",background:"var(--bg)",padding:20}}>
      {toast&&<div style={{position:"fixed",top:20,right:20,background:"var(--primary)",color:"#fff",padding:"10px 16px",borderRadius:8,fontSize:12,zIndex:999}}>{toast}</div>}
      <div style={{maxWidth:800,margin:"0 auto"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
          <div style={{width:40,height:40,background:ac,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center"}}>{brand?.logo && brand.logo !== "🔒"?<span style={{fontSize:20}}>{brand.logo}</span>:<Lock size={20} color="white" />}</div>
          <div>
            <div style={{fontWeight:800,fontSize:18}}>{proj.name}</div>
            <div style={{fontSize:11,color:"var(--muted)"}}>Shared by ScopeLock</div>
          </div>
        </div>

        <div className="card" style={{padding:20,marginBottom:16}}>
          <div className="lbl">Scope Baseline</div>
          <pre style={{whiteSpace:"pre-wrap",fontSize:12,fontFamily:"'IBM Plex Mono',monospace",color:"var(--text)",lineHeight:1.6}}>{proj.baseline||"No scope defined"}</pre>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:24}}>
          <div className="card" style={{padding:16,textAlign:"center"}}>
            <div style={{fontSize:28,fontWeight:800,color:"var(--green)"}}>{approvedCRs.length}</div>
            <div style={{fontSize:10,color:"var(--muted)"}}>Approved</div>
          </div>
          <div className="card" style={{padding:16,textAlign:"center"}}>
            <div style={{fontSize:28,fontWeight:800,color:"var(--amber)"}}>{pendingCRs.length}</div>
            <div style={{fontSize:10,color:"var(--muted)"}}>Pending</div>
          </div>
          <div className="card" style={{padding:16,textAlign:"center"}}>
            <div style={{fontSize:28,fontWeight:800,color:"var(--primary)"}}>{crs.length}</div>
            <div style={{fontSize:10,color:"var(--muted)"}}>Total CRs</div>
          </div>
        </div>

        {/* Tasks Section for Client View */}
        {tasks.length>0&&(
          <div className="card" style={{padding:20,marginBottom:16}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div className="lbl">Tasks</div>
              <div style={{fontSize:11,color:"rgba(124,58,238,0.8)",background:"rgba(124,58,238,0.06)",padding:"4px 10px",borderRadius:20,border:"1px solid rgba(124,58,238,0.15)"}}>
                👁 Client view — real-time task progress
              </div>
            </div>
            <div style={{marginBottom:12}}>
              <div style={{height:4,borderRadius:999,background:"rgba(255,255,255,0.08)",marginBottom:6}}>
                <div style={{height:"100%",width:taskPct+"%",borderRadius:999,background:"#7c3aed",transition:"width 0.3s"}}></div>
              </div>
              <div style={{fontSize:11,opacity:0.5}}>{taskPct}% · {doneTasks} of {tasks.length} tasks done</div>
            </div>
            <div style={{display:"grid",gap:8}}>
              {tasks.map((t,idx)=>(
                <div key={t.id||idx} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:"var(--surface2)",borderRadius:6}}>
                  <div style={{width:8,height:8,borderRadius:4,background:t.status==="done"?"#22c55e":t.status==="in_progress"?"#a78bfa":t.status==="blocked"?"#f87171":"rgba(255,255,255,0.15)"}}></div>
                  <div style={{flex:1,fontSize:12}}>{t.name}</div>
                  <div style={{fontSize:10,color:t.status==="done"?"#22c55e":t.status==="in_progress"?"#a78bfa":t.status==="blocked"?"#f87171":"rgba(255,255,255,0.5)"}}>{t.status==="done"?"Done":t.status==="in_progress"?"In Progress":t.status==="blocked"?"Blocked":"Not Started"}</div>
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="card" style={{padding:20}}>
          <div className="lbl" style={{marginBottom:12}}>Change Requests</div>
          {crs.length===0?(<div style={{fontSize:12,color:"var(--muted)"}}>No change requests yet.</div>):(
            <div style={{display:"grid",gap:10}}>
              {crs.map(cr=>(
                <div key={cr.id} style={{padding:12,background:"var(--surface2)",borderRadius:8,borderLeft:`3px solid ${cr.status==="approved"?"var(--green)":cr.status==="rejected"?"var(--red)":"var(--amber)"}`}}>
                  <div style={{fontWeight:600,fontSize:12,marginBottom:4}}>{cr.description}</div>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                    <span style={{fontSize:10,color:"var(--muted)"}}>{cr.requestedBy}</span>
                    <span style={{fontSize:10,fontWeight:600,padding:"2px 8px",borderRadius:10,background:cr.status==="approved"?"var(--green)":cr.status==="rejected"?"var(--red)":"var(--amber)",color:"#fff"}}>{cr.status?.toUpperCase()}</span>
                  </div>
                  {cr.charge&&<div style={{fontSize:11,fontWeight:600,color:"var(--primary)",marginBottom:8}}>+{brand?.currency||"USD"} {Number(cr.charge).toLocaleString()}</div>}
                  {cr.impact&&<div style={{fontSize:10,color:"var(--muted)",marginBottom:8}}>Impact: {cr.impact}</div>}
                  {cr.comments&&cr.comments.length>0&&(
                    <div style={{marginTop:8,borderTop:"1px solid var(--border)",paddingTop:8}}>
                      <div style={{fontSize:10,fontWeight:600,marginBottom:4,color:"var(--muted)"}}>Comments:</div>
                      {cr.comments.map((cmt,i)=>(
                        <div key={i} style={{fontSize:11,marginBottom:4,color:"var(--text)"}}>
                          <span style={{fontWeight:600}}>{cmt.author}:</span> {cmt.text}
                        </div>
                      ))}
                    </div>
                  )}
                  {cr.status==="pending"&&(
                    <div style={{display:"flex",gap:8,marginTop:12}}>
                      {canComment&&(
                        <button onClick={()=>setShowCommentModal(cr.id)} style={{flex:1,padding:"8px",fontSize:11,background:"var(--surface)",border:"1px solid var(--border)",borderRadius:6,cursor:"pointer",color:"var(--text)"}}>💬 Comment</button>
                      )}
                      {canApprove&&(
                        <>
                          <button onClick={()=>handleApprove(cr.id)} disabled={processing} style={{flex:1,padding:"8px",fontSize:11,background:"var(--green)",border:"none",borderRadius:6,cursor:"pointer",color:"#fff",fontWeight:600}}>✓ Approve</button>
                          <button onClick={()=>setShowRejectModal(cr.id)} disabled={processing} style={{flex:1,padding:"8px",fontSize:11,background:"var(--red)",border:"none",borderRadius:6,cursor:"pointer",color:"#fff",fontWeight:600}}>✕ Reject</button>
                        </>
                      )}
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Comment Modal */}
        {showCommentModal&&(
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999}} onClick={()=>setShowCommentModal(null)}>
            <div style={{background:"var(--surface)",borderRadius:16,padding:24,width:"90%",maxWidth:400}} onClick={e=>e.stopPropagation()}>
              <div style={{fontWeight:700,fontSize:16,marginBottom:16}}>Add Comment</div>
              <textarea value={commentText} onChange={e=>setCommentText(e.target.value)} placeholder="Your feedback..." style={{width:"100%",minHeight:100,background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:8,padding:12,color:"var(--text)",fontSize:13,boxSizing:"border-box"}}/>
              <div style={{marginTop:16,display:"flex",gap:10,justifyContent:"flex-end"}}>
                <button onClick={()=>setShowCommentModal(null)} style={{padding:"8px 16px",background:"var(--surface2)",border:"none",borderRadius:6,cursor:"pointer",color:"var(--text)"}}>Cancel</button>
                <button onClick={()=>handleAddComment(showCommentModal)} disabled={processing||!commentText.trim()} style={{padding:"8px 16px",background:"var(--primary)",border:"none",borderRadius:6,cursor:"pointer",color:"#fff",opacity:processing||!commentText.trim()?0.5:1}}>Send</button>
              </div>
            </div>
          </div>
        )}

        {/* Reject Modal */}
        {showRejectModal&&(
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999}} onClick={()=>setShowRejectModal(null)}>
            <div style={{background:"var(--surface)",borderRadius:16,padding:24,width:"90%",maxWidth:400}} onClick={e=>e.stopPropagation()}>
              <div style={{fontWeight:700,fontSize:16,marginBottom:16,color:"var(--red)"}}>Reject Change Request</div>
              <p style={{fontSize:12,color:"var(--muted)",marginBottom:16}}>Please provide a reason for rejecting this CR.</p>
              <textarea value={rejectReason} onChange={e=>setRejectReason(e.target.value)} placeholder="Reason for rejection..." style={{width:"100%",minHeight:100,background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:8,padding:12,color:"var(--text)",fontSize:13,boxSizing:"border-box"}}/>
              <div style={{marginTop:16,display:"flex",gap:10,justifyContent:"flex-end"}}>
                <button onClick={()=>setShowRejectModal(null)} style={{padding:"8px 16px",background:"var(--surface2)",border:"none",borderRadius:6,cursor:"pointer",color:"var(--text)"}}>Cancel</button>
                <button onClick={()=>handleReject(showRejectModal)} disabled={processing||!rejectReason.trim()} style={{padding:"8px 16px",background:"var(--red)",border:"none",borderRadius:6,cursor:"pointer",color:"#fff",opacity:processing||!rejectReason.trim()?0.5:1}}>Reject</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

    },
    "export":{
      keywords:["export","download","csv","pdf","print","save"],
      answer:`💾 **Export Options:**\n\n• **CSV** — Download CRs as spreadsheet\n• **PDF** — Generate professional invoice\n• **Print** — Print-friendly view\n\nGreat for record-keeping and sending to clients!`
    },
    
    // Help
    "help":{
      keywords:["help","help me","what can you do","capabilities","how do i"],
      answer:`💡 **I can help you with:**\n\n📋 Scope & Baseline\n   "What is scope creep?"\n   "How do I lock my scope?"\n\n📋 Change Requests\n   "How do CRs work?"\n   "How to create a CR?"\n\n✅ Approve/Reject\n   "How to approve a CR?"\n   "What if client disputes?"\n\n🧾 Invoices\n   "How to bill for extras?"\n   "Generate an invoice"\n\n🔗 Sharing\n   "How to share with client?"\n\n📊 Analytics\n   "What is drift?"\n\nJust ask me anything!`
    }
  };

  // Intelligent response generator
  function generateResponse(question){
    const q=question.toLowerCase().trim();
    
    // Direct matches first
    for(const [key,data] of Object.entries(knowledgeBase)){
      for(const keyword of data.keywords){
        if(q.includes(keyword))return data.answer;
      }
    }
    
    // Pattern matching for questions
    if(q.startsWith("how")||q.startsWith("what")||q.startsWith("can i")||q.startsWith("do i")||q.startsWith("is it")){
      // Question patterns
      if(/how (do|to|can i)/.test(q)){
        if(/project/.test(q))return knowledgeBase["create project"].answer;
        if(/cr|change request|extra work/.test(q))return knowledgeBase["how to create cr"].answer;
        if(/invoice|bill|charge|pay/.test(q))return knowledgeBase["how to invoice"].answer;
        if(/share|link|client/.test(q))return knowledgeBase["share"].answer;
      }
      if(/what (is|are)/.test(q)){
        if(/scope|baseline/.test(q))return knowledgeBase["scope"].answer;
        if(/cr|change request/.test(q))return knowledgeBase["change request"].answer;
        if(/drift/.test(q))return knowledgeBase["drift"].answer;
        if(/invoice|bill/.test(q))return knowledgeBase["invoice"].answer;
        if(/project/.test(q))return knowledgeBase["project"].answer;
      }
      if(/can i (.+) with/.test(q)||/can (.+) share/.test(q)){
        if(/client|share/.test(q))return knowledgeBase["share"].answer;
      }
      if(/how much|price|cost|free|pricing/.test(q)){
        return "💰 ScopeLock has a **Free plan** for freelancers:\n\n• 1 active project\n• Up to 3 change requests\n• Scope drift tracking\n\n**Pro ($9/mo)** adds:\n• 5 projects\n• Client share links\n• Invoice generator\n• PDF export\n• E-signature on scope baseline\n• Client comment threads\n\n**Business ($19/mo)** adds:\n• Unlimited projects\n• Custom branding on share links\n• Priority email support\n• Webhook integrations";
      }
      if(/who|made|build|creator|about/.test(q)){
        return "👋 ScopeLock is built by **Raejohn Carandang**\n\nIt's designed to help freelancers and project managers stop scope creep and get paid for extra work.\n\nTry it free at scopelock.app!";
      }
      if(/thank|thanks|thx/.test(q)){
        return "You're welcome! 😊 Is there anything else you'd like to know about ScopeLock?";
      }
      if(/hello|hi|hey/.test(q)){
        return "Hello! 👋 How can I help you with ScopeLock today?";
      }
    }
    
    // Fallback responses
    const fallbacks=[
      "🤔 I'm not sure I understand that question. Try asking about:\n\n• Scope & baseline\n• Change requests\n• Approving/rejecting CRs\n• Invoices\n• Sharing with clients\n• Drift & analytics",
      "I'm here to help with ScopeLock questions! Try asking:\n\n• \"How do I create a project?\"\n• \"What is scope creep?\"\n• \"How do CRs work?\"\n• \"How to invoice extras?\"\n• \"How to share with clients?\"",
      "That's an interesting question! I specialize in ScopeLock help. Try asking about:\n\n• Creating & managing projects\n• Change request workflow\n• Billing & invoices\n• Client sharing\n• Scope drift"
    ];
    
    return fallbacks[Math.floor(Math.random()*fallbacks.length)];
  }

  const quickPrompts=[
    "What is scope creep?",
    "How do CRs work?",
    "How to invoice extras?",
    "How to share with client?"
  ];

  async function send(){
    if(!input.trim()||loading)return;
    const userMsg=input.trim();
    setInput("");
    setMsgs(m=>[...m,{role:"user",text:userMsg}]);
    setLoading(true);

    try{
      await new Promise(r=>setTimeout(r,800));
      const reply=generateResponse(userMsg);
      setMsgs(m=>[...m,{role:"bot",text:reply}]);
    }catch(e){
      setMsgs(m=>[...m,{role:"bot",text:"Sorry, something went wrong. Please try again!"}]);
    }
    setLoading(false);
  }

  function handleKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}

  return(
    <>
      {open&&(
        <div className="chat-window">
          {/* Header */}
          <div className="chat-header">
            <div style={{width:36,height:36,borderRadius:"50%",background:"rgba(255,255,255,0.25)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>🤖</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:14,color:"#fff",fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif"}}>ScopeLock Assistant</div>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.7)",fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",display:"flex",alignItems:"center",gap:6}}>
                <span style={{width:6,height:6,borderRadius:"50%",background:"#34D399"}}/>Online · Always here to help
              </div>
            </div>
            <button onClick={()=>setOpen(false)} style={{background:"none",border:"none",color:"rgba(255,255,255,0.8)",fontSize:18,cursor:"pointer",padding:"4px"}}>✕</button>
          </div>

          {/* Messages */}
          <div className="chat-messages">
            {msgs.map((m,i)=>(
              <div key={i} className={`chat-msg ${m.role}`} style={{whiteSpace:"pre-wrap",fontSize:13,lineHeight:1.6}}>
                {m.text}
              </div>
            ))}
            {loading&&(
              <div className="chat-msg typing" style={{padding:"12px 16px"}}>
                <div style={{display:"flex",gap:4,alignItems:"center"}}>
                  {[0,1,2].map(i=>(
                    <div key={i} style={{width:7,height:7,borderRadius:"50%",background:"var(--primary)",animation:`pulse 1.2s ease ${i*0.2}s infinite`}}/>
                  ))}
                </div>
              </div>
            )}
            <div ref={bottomRef}/>
          </div>

          {/* Quick prompts */}
          {msgs.length<3&&(
            <div style={{padding:"4px 12px 12px",display:"flex",flexWrap:"wrap",gap:8}}>
              {quickPrompts.map(q=>(
                <button key={q} onClick={()=>{setInput(q);}} style={{fontSize:11,padding:"8px 14px",background:"rgba(139,92,246,0.08)",border:"1px solid rgba(139,92,246,0.2)",borderRadius:4,color:"var(--primary)",cursor:"pointer",fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",transition:"all 0.15s"}}
                  onMouseEnter={e=>{e.currentTarget.style.background="rgba(139,92,246,0.15)";e.currentTarget.style.transform="scale(1.02)";}}
                  onMouseLeave={e=>{e.currentTarget.style.background="rgba(139,92,246,0.08)";e.currentTarget.style.transform="scale(1)";}}>
                  {q}
                </button>
              ))}
            </div>
          )}

          {/* Input */}
          <div className="chat-input-row" style={{padding:"12px",background:"var(--surface)"}}>
            <input
              value={input}
              onChange={e=>setInput(e.target.value)}
              onKeyDown={handleKey}
              placeholder="Ask me anything..."
              disabled={loading}
              style={{padding:"12px 16px",borderRadius:24,border:"1px solid var(--border)",background:"var(--surface2)"}}
            />
            <button className="chat-send" onClick={send} disabled={loading||!input.trim()} style={{borderRadius:24,width:44,height:44,opacity:loading||!input.trim()?0.5:1}}>
              {loading?"...":"➤"}
            </button>
          </div>
        </div>
      )}

      {/* Floating bubble */}
      <button className={`chat-bubble${open?" open":""}`} onClick={()=>setOpen(o=>!o)} title="Chat with ScopeLock AI" style={{background:open?"var(--surface)":"linear-gradient(135deg,#7C3AED,var(--teal))"}}>
        {open?<span style={{color:"var(--text)",fontSize:16,fontWeight:600}}>✕</span>:<MessageCircle size={20} color="white" />}
      </button>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <>
    <App/>
    <ScopeLockChatbot/>
  </>
);
</script>

-- 1. PROJECTS
create table projects (
  id uuid primary key default gen_random_uuid(),
  name text not null,
  client_name text,
  client_currency text default 'USD',
  owner_id uuid references auth.users(id) on delete cascade not null,
  due_date date,
  baseline text not null,
  original_budget numeric,
  drift_history jsonb default '[0]',
  created_at timestamptz default now()
);
alter table projects enable row level security;
create policy "Users manage own projects" on projects for all using (auth.uid() = owner_id);

-- 2. CHANGE REQUESTS
create table change_requests (
  id uuid primary key default gen_random_uuid(),
  project_id uuid references projects(id) on delete cascade not null,
  description text not null,
  impact text default 'Low — estimated',
  requested_by text not null,
  status text default 'pending' check (status in ('pending','approved','rejected','disputed')),
  priority text default 'normal' check (priority in ('normal','urgent')),
  rejection_reason text,
  hours numeric,
  charge numeric,
  client_approved_by text,
  client_approved_at timestamptz,
  client_dispute_reason text,
  created_at timestamptz default now()
);
alter table change_requests enable row level security;
create policy "Users manage own CRs" on change_requests for all
  using (project_id in (select id from projects where owner_id = auth.uid()))
  with check (project_id in (select id from projects where owner_id = auth.uid()));

-- 3. AUDIT LOGS
create table audit_logs (
  id uuid primary key default gen_random_uuid(),
  project_id uuid references projects(id) on delete cascade not null,
  cr_id uuid references change_requests(id) on delete cascade,
  action text not null,
  actor text not null,
  detail text,
  created_at timestamptz default now()
);
alter table audit_logs enable row level security;
create policy "Users view own audit logs" on audit_logs for all
  using (project_id in (select id from projects where owner_id = auth.uid()));

-- 4. USER PROFILES (brand + plan settings)
create table user_profiles (
  user_id uuid primary key references auth.users(id) on delete cascade,
  brand jsonb default '{"company":"","tagline":"","color":"var(--amber)","logo":"🔒"}',
  plan text default 'free',
  trial_status text default 'none',
  trial_started_at timestamptz,
  trial_end_at timestamptz,
  payment_type text default 'none',
  payment_date timestamptz,
  subscription_id text,
  subscription_status text default 'inactive',
  subscription_expires_at timestamptz,
  is_lifetime boolean default false,
  updated_at timestamptz default now()
);
alter table user_profiles enable row level security;
create policy "Users manage own profile" on user_profiles for all using (auth.uid() = user_id);

-- 4b. NOTIFICATIONS
create table notifications (
  id uuid primary key default gen_random_uuid(),
  user_id uuid references auth.users(id) on delete cascade not null,
  type text not null,
  title text not null,
  body text,
  project_id uuid references projects(id) on delete cascade,
  cr_id uuid references change_requests(id) on delete cascade,
  read boolean default false,
  created_at timestamptz default now()
);
alter table notifications enable row level security;
create policy "Users view own notifications" on notifications for select using (auth.uid() = user_id);
create policy "Users insert own notifications" on notifications for insert with check (auth.uid() = user_id);
