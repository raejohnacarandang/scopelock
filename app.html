                          <span style={{fontSize:12,opacity:0.3}}>·</span>
                          {dl!==null&&(
                            <span style={{display:"flex",alignItems:"center",gap:3,color:dl<0?"var(--red)":"var(--muted2)"}}>
                              <Icon name="Calendar" size={10} color={dl<0?"var(--red)":"var(--muted2)"}></Icon>Due {p.dueDate?new Date(p.dueDate).toLocaleDateString("en-US",{month:"short",day:"numeric"}):"—"}
                            </span>
                          )}
                          <span style={{fontSize:12,opacity:0.3}}>·</span>
                          <span style={{display:"flex",alignItems:"center",gap:3}}>
                            <Icon name="List" size={10} color="var(--muted2)"></Icon>{crCount} CRs
                          </span>
                          <span style={{fontSize:12,opacity:0.3}}>·</span>
                          <span style={{display:"flex",alignItems:"center",gap:3}}>
                            <Icon name="Clock" size={10} color="var(--muted2)"></Icon>{lastActivityText}
                          </span>
                        </div>
                      </div>
                      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:8,flexShrink:0}}>
                        <HealthRing score={h.score} color={h.color} label={h.label}/>
                        <div style={{textAlign:"right"}}>
                          <div style={{color:d.color,fontWeight:700,fontSize:18,fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",lineHeight:1}}>{d.pct}%</div>
                          <div style={{fontSize:9,color:d.color,letterSpacing:"0.04em",display:"flex",alignItems:"center",gap:3}}>
                            {d.level}
                            <span className="tooltip-wrap">
                              <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:12,height:12,borderRadius:"50%",background:"rgba(0,0,0,0.1)",fontSize:8,cursor:"help",fontWeight:700}}>?</span>
                              <span className="tooltip-box" style={{fontSize:11,width:240}}>📊 <strong>Scope Drift</strong> measures how much extra work has been added beyond the original scope. Calculated from approved + pending CRs. 0% = on track · 20–40% = moderate creep · 40%+ = critical</span>
                            </span>
                          </div>
                          <div className="dbar" style={{width:60,marginTop:4}}><div style={{height:"100%",width:`${d.pct}%`,background:d.color,borderRadius:3,transition:"width 0.3s"}}/></div>
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })}
              {!projects.length&&filteredProjects.length===0&&(
                <div className="card animate-fade-up empty-state" style={{padding:"48px 32px",textAlign:"center",borderRadius:16,position:"relative",overflow:"hidden"}}>

                    <Icon name="Lock" size={32} color="#7c3aed"/>

                  </div>

              {projects.length>0&&filteredProjects.length===0&&(
                <div className="card" style={{padding:"32px 24px",textAlign:"center",color:"var(--muted)"}}>
                  <div style={{fontSize:24,marginBottom:8}}>🔍</div>

                </div>

            </div>
          </div>

        {/* ── NEW PROJECT ── */}
        {view==="np"&&(
          <div className="fade" style={{maxWidth:900,margin:"0 auto"}}>
            {(()=>{
              let hasDraft=false;
              try{const d=localStorage.getItem("sl_np_draft");if(d){const p=JSON.parse(d);hasDraft=!!(p.name||p.baseline);}}catch(e){}
              return hasDraft&&(np.name||np.baseline)?(
                <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:"rgba(14,165,233,0.06)",border:"1px solid rgba(14,165,233,0.2)",borderRadius:8,marginBottom:14,fontSize:12,color:"var(--teal)"}}>
                  <span>💾</span>
                  <span style={{flex:1}}>Draft restored — your unsaved project details are back.</span>
                  <button onClick={()=>{setNp({name:"",client:"",baseline:"",dueDate:"",originalBudget:""});try{localStorage.removeItem("sl_np_draft");}catch(e){}}} style={{background:"none",border:"none",color:"var(--muted)",cursor:"pointer",fontSize:11,fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif"}}>Discard</button>
                </div>
              ):null;
            })()}
            <div style={{fontSize:11,color:"#4b5563",marginBottom:8}}>Dashboard / New Project</div>
            <h2 style={{...H,fontSize:"1.75rem",fontWeight:800,marginBottom:3,color:darkMode?"#f9fafb":"#111827"}}>Lock New Scope</h2>
            <p style={{color:"#6b7280",fontSize:12,marginBottom:16}}>Once locked, all changes require formal approval.</p>
            <div style={{background:"rgba(124,58,237,0.04)",border:"1px solid rgba(124,58,237,0.12)",borderRadius:10,padding:"14px 16px",marginBottom:24}}>
              <div style={{fontSize:11,color:"var(--primary)",fontWeight:700,marginBottom:12,display:"flex",alignItems:"center",gap:6}}><span style={{display:"flex"}}><Icon name="Check" size={12} color="var(--primary)"/></span> Step 1 of 4 — Lock your project scope</div>
              <div style={{display:"flex",alignItems:"center",gap:0}}>
                {[
                  {n:1,icon:"Lock",label:"Lock Scope",a:true,done:false},
                  {n:2,icon:"List",label:"Log CRs",a:false,done:false},
                  {n:3,icon:"Check",label:"Approve",a:false,done:false},
                  {n:4,icon:"Invoice",label:"Invoice",a:false,done:false}
                ].map((s,i)=>(
                  <React.Fragment key={i}>
                    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,flex:s.a?1.2:1}}>
                      <div style={{width:32,height:32,borderRadius:"50%",background:s.done?"#10b981":s.a?"linear-gradient(135deg, #7c3aed, #6d28d9)":"rgba(255,255,255,0.06)",border:s.a||s.done?"none":"1px solid rgba(255,255,255,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700,color:s.done?"#fff":s.a?"#fff":"#6b7280",boxShadow:s.a?"0 4px 12px rgba(124,58,237,0.4)":s.done?"0 2px 8px rgba(16,185,129,0.3)":"none"}}>{s.done?<Icon name="Check" size={14} color="#fff"/>:s.n}</div>
                      <div style={{fontSize:10,fontWeight:s.a?700:400,color:s.done?"#10b981":s.a?"#a78bfa":"#6b7280",whiteSpace:"nowrap"}}>{s.label}</div>
                    </div>
                    {i<3&&<div style={{flex:1,height:2,background:"rgba(255,255,255,0.1)",margin:"0 4px",marginBottom:18,borderRadius:1}}/>}
                  </React.Fragment>
                ))}
              </div>
              <div style={{fontSize:"0.8rem",color:"#6b7280",marginTop:10,lineHeight:1.6,padding:"8px 12px",background:"rgba(124,58,237,0.03)",borderRadius:6,display:"flex",alignItems:"flex-start",gap:6}}><Icon name="Info" size={12} color="var(--primary)"/> After locking, all client changes must go through formal Change Requests — no more informal "just add this" via chat.</div>
            </div>
            <div className="card" style={{padding:28,background:"#0d1117",border:"1px solid rgba(255,255,255,0.08)",borderRadius:12,boxShadow:"0 4px 24px rgba(0,0,0,0.3)"}}>
              <div className="np-form-grid">
                {/* Template - full width */}
                <div style={{gridColumn:"1 / -1",minHeight:48,display:"flex",flexDirection:"column"}}><div className="lbl" style={{marginBottom:6}}>Use a Template</div>
                  <select style={{marginTop:"auto"}} value={ptpl} onChange={e=>{setPtpl(e.target.value);const t=PT.find(t=>t.name===e.target.value);if(t)setNp(p=>({...p,name:t.name,baseline:t.baseline}));}}>
                    <option value="">— Start from scratch —</option>
                    {PT.map(t=><option key={t.name}>{t.name}</option>)}
                  </select>
                </div>

                {/* Row 1: Project Name | Client / Team */}
                <div style={{minHeight:48,display:"flex",flexDirection:"column"}}><div className="lbl" style={{marginBottom:6}}>Project Name *</div>
                  <div className="field-hint" style={{marginBottom:10}}>Give it a clear name — e.g. "Santos Restaurant Website" or "Cruz Dental App v2"</div>
                  {npErrors.name&&<div style={{display:"flex",gap:6,alignItems:"flex-start",padding:"8px 12px",background:"rgba(239,68,68,0.06)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:8,marginBottom:8}}><span style={{color:"var(--red)",fontSize:13,flexShrink:0}}>⚠</span><span style={{fontSize:12,color:"var(--red)",lineHeight:1.6}}>{npErrors.name}</span></div>}
                  <input style={{border:npErrors.name?"1px solid var(--red)":undefined,marginTop:"auto"}} placeholder="e.g. Santos Restaurant Website Redesign" value={np.name} maxLength={60} onChange={e=>{setNp(p=>({...p,name:e.target.value}));setHasUnsaved(true);if(npErrors.name)setNpErrors(er=>({...er,name:""}))}}/></div>
                <div style={{minHeight:48,display:"flex",flexDirection:"column"}}><div className="lbl" style={{marginBottom:6}}>Client / Team</div>
                  <div className="field-hint" style={{marginBottom:10}}>Who are you doing this project for? This name appears on invoices and the client share link.</div>
                  <input style={{marginTop:"auto"}} placeholder="e.g. Maria Santos / Acme Corp" value={np.client} maxLength={60} onChange={e=>setNp(p=>({...p,client:e.target.value}))}/></div>

                {/* Row 2: Client Currency | Scope Baseline */}
                <div style={{minHeight:48,display:"flex",flexDirection:"column"}}><div className="lbl" style={{marginBottom:6}}>Client Currency</div>
                  <div className="field-hint" style={{marginBottom:10}}>Select the currency your client pays in.</div>
                  <select className="std-input" style={{marginTop:"auto"}} value={np.clientCurrency||"USD"} onChange={e=>setNp(p=>({...p,clientCurrency:e.target.value}))}>
                    <option value="USD">USD - US Dollar ($)</option>
                    <option value="PHP">PHP - Philippine Peso (₱)</option>
                    <option value="EUR">EUR - Euro (€)</option>
                    <option value="GBP">GBP - British Pound (£)</option>
                    <option value="SGD">SGD - Singapore Dollar (S$)</option>
                    <option value="AUD">AUD - Australian Dollar (A$)</option>
                    <option value="CAD">CAD - Canadian Dollar (C$)</option>
                    <option value="JPY">JPY - Japanese Yen (¥)</option>
                  </select></div>
                <div style={{minHeight:48,display:"flex",flexDirection:"column"}}>
                  <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:5}}>
                    <div className="lbl" style={{marginBottom:0}}>Scope Baseline *</div>
                    <div className="tip"><span style={{color:"var(--muted)",fontSize:10,cursor:"help"}}>ⓘ</span><div className="tip-box">Write exactly what is IN scope. Also mention what is NOT included.</div></div>

                  <div className="field-hint" style={{marginBottom:10}}>Define exactly what is included and NOT included.</div>
                  {npErrors.baseline&&<div style={{display:"flex",gap:6,alignItems:"flex-start",padding:"8px 12px",background:"rgba(239,68,68,0.06)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:8,marginBottom:8}}><span style={{color:"var(--red)",fontSize:13,flexShrink:0}}>⚠</span><span style={{fontSize:12,color:"var(--red)",lineHeight:1.6}}>{npErrors.baseline}</span></div>}
                  <textarea style={{border:npErrors.baseline?"1px solid var(--red)":undefined,minHeight:140,marginTop:"auto"}} placeholder="What's included. What's excluded. Be specific." value={np.baseline} onChange={e=>{setNp(p=>({...p,baseline:e.target.value}));if(npErrors.baseline)setNpErrors(er=>({...er,baseline:""}))}}/>
                  {np.baseline&&<div style={{fontSize:10,color:"var(--muted)",marginTop:4,textAlign:"right",fontFamily:"'IBM Plex Mono',monospace"}}>{np.baseline.length} chars</div>}
                </div>

                {/* Row 3: Due Date | Original Budget */}
                <div style={{minHeight:48,display:"flex",flexDirection:"column"}}><div className="lbl" style={{marginBottom:6}}>Due Date <span style={{fontSize:10,color:"var(--muted2)",fontWeight:400,textTransform:"none",letterSpacing:0}}>(optional)</span></div>
                  <div className="field-hint" style={{marginBottom:10}}>When is this project expected to be delivered?</div>
                  <input type="date" style={{marginTop:"auto"}} value={np.dueDate} onChange={e=>setNp(p=>({...p,dueDate:e.target.value}))}/>
                  {np.dueDate&&new Date(np.dueDate)<new Date(new Date().toDateString())&&<div style={{fontSize:11,color:"var(--amber)",marginTop:4,fontFamily:"'IBM Plex Mono',monospace",display:"flex",alignItems:"center",gap:4}}><Icon name="Warning" size={12} color="var(--amber)"/> This date is in the past</div>}
                </div>
                <div style={{minHeight:48,display:"flex",flexDirection:"column"}}><div className="lbl" style={{marginBottom:6}}>Original Budget <span style={{fontSize:10,color:"var(--muted2)",fontWeight:400,textTransform:"none",letterSpacing:0}}>(optional)</span></div>
                  <div className="field-hint" style={{marginBottom:10}}>Fixed price for this project.</div>
                  <input type="number" min="0" placeholder="e.g. 5000" style={{marginTop:"auto"}} value={np.originalBudget||""} onChange={e=>setNp(p=>({...p,originalBudget:e.target.value}))}/>
                  {np.originalBudget&&<div style={{fontSize:11,color:"var(--green)",marginTop:4,fontFamily:"'IBM Plex Mono',monospace"}}>{np.clientCurrency||"USD"} {Number(np.originalBudget).toLocaleString()}</div>}
                </div>
              </div>

              <div style={{background:"rgba(245,158,11,0.08)",border:"1px solid rgba(245,158,11,0.2)",borderRadius:8,padding:"11px 15px",display:"flex",gap:9,fontSize:12,color:"#f59e0b",lineHeight:1.6}}>
                <span style={{color:"#f59e0b"}}><Icon name="Warning" size={14} color="#f59e0b"/></span><span><strong>Before you lock:</strong> Once locked, the scope cannot be edited directly. Any scope change must go through a formal Change Request. Make sure everything is accurate.</span>
              </div>
                
              <div className="tab-switcher" style={{display:"flex",background:"rgba(255,255,255,0.06)",borderRadius:10,padding:4,marginBottom:16,border:"1px solid rgba(255,255,255,0.1)"}}>
                {["edit","preview"].map(t=>(
                  <button key={t} onClick={()=>setShowPreview(t==="preview")}
                    className="tab-btn"
                    style={{flex:1,padding:"8px",borderRadius:8,border:"none",cursor:"pointer",fontSize:13,fontWeight:600,
                      fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",transition:"all 0.12s",display:"flex",alignItems:"center",justifyContent:"center",gap:5,
                      background:"transparent",
                      border:"none",
                      color:"#9ca3af"}}>
                    <Icon name={t==="edit"?"Edit":"Eye"} size={14} color="#9ca3af"></Icon><span>{t==="edit"?"Edit":"Preview as Document"}</span>
                  </button>
                ))}
              </div>

              {!showPreview&&(
                <div style={{background:"rgba(124,58,237,0.03)",border:"1px solid rgba(124,58,237,0.1)",borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:"0.8rem",color:"#4b5563",lineHeight:1.7,display:"flex",alignItems:"center",gap:6}}>
                  <Icon name="Info" size={12} color="#6b7280"/> Switch to <strong>Preview</strong> to see exactly how your scope document will look before locking it.
                </div>
              )}

              {showPreview&&(
                <div className="doc-preview" style={{width:"100%",background:"#ffffff",border:"1px solid #e5e7eb",borderRadius:14,overflow:"hidden",marginBottom:12}}>
                  <div style={{background:"linear-gradient(135deg,#7C3AED,var(--teal))",padding:"20px 24px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                      <div style={{width:32,height:32,borderRadius:8,background:"rgba(255,255,255,0.2)",display:"flex",alignItems:"center",justifyContent:"center"}}><Lock size={18} color="white" /></div>
                      <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.7)",letterSpacing:"0.12em",fontFamily:"'IBM Plex Mono',monospace"}}>SCOPE DOCUMENT</div>
                    </div>
                    <div style={{fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",fontWeight:800,fontSize:22,color:"#fff",marginBottom:4,lineHeight:1.2}}>{np.name||"Project Name"}</div>
                      <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
                        {np.client&&<div style={{fontSize:12,color:"rgba(255,255,255,0.8)",display:"flex",alignItems:"center",gap:4}}><Icon name="User" size={12} color="rgba(255,255,255,0.8)"/> Client: {np.client}</div>}
                        {np.dueDate&&<div style={{fontSize:12,color:"rgba(255,255,255,0.8)",display:"flex",alignItems:"center",gap:4}}><Icon name="Calendar" size={12} color="rgba(255,255,255,0.8)"/> Due: {np.dueDate}</div>}
                        {np.originalBudget&&<div style={{fontSize:12,color:"rgba(255,255,255,0.8)",display:"flex",alignItems:"center",gap:4}}><Icon name="DollarSign" size={12} color="rgba(255,255,255,0.8)"/> Budget: {np.clientCurrency||"USD"} {Number(np.originalBudget).toLocaleString()}</div>}
                        <div style={{fontSize:12,color:"rgba(255,255,255,0.7)",display:"flex",alignItems:"center",gap:4}}><Icon name="Calendar" size={12} color="rgba(255,255,255,0.7)"/> Created: {new Date().toLocaleDateString()}</div>
                      </div>
                  </div>

                  <div style={{padding:"20px 24px"}}>
                    {np.baseline?(()=>{
                      const lines=np.baseline.split("\n").filter(l=>l.trim());
                      const inLines=lines.filter(l=>/^(✅|IN:|in:|included|✓)/i.test(l.trim())||l.includes("✅")||l.toLowerCase().includes(" in:"));
                      const outLines=lines.filter(l=>/^(❌|OUT:|out:|excluded|✗|not included)/i.test(l.trim())||l.includes("❌")||l.toLowerCase().includes(" out:"));
                      const otherLines=lines.filter(l=>!inLines.includes(l)&&!outLines.includes(l));

                      return(
                        <div>
                          {otherLines.length>0&&inLines.length===0&&outLines.length===0&&(
                            <div style={{marginBottom:16}}>
                              <div style={{fontSize:11,fontWeight:700,color:darkMode?"#9ca3af":"#6b7280",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8,fontFamily:"'IBM Plex Mono',monospace"}}>SCOPE BASELINE</div>
                              <p style={{fontSize:14,color:darkMode?"#e5e7eb":"#1f2937",lineHeight:1.85,whiteSpace:"pre-wrap"}}>{np.baseline}</p>

{(cr.hours||cr.charge)&&(

                          <div style={{fontSize:10,color:"var(--muted)",marginTop:4}}>
                            {cr.requestedBy} · {fmtDate(cr.createdAt||cr.created_at)}
                            {(cr.comments||[]).length>0&&<span style={{marginLeft:6}}>{(cr.comments||[]).length} comment{(cr.comments||[]).length!==1?"s":""}</span>}
                          </div>
                        </div>
                        <div className="cr-actions" style={{display:"flex",flexDirection:"column",gap:4,alignItems:"flex-end"}}>
                          {cr.status==="pending"&&<>
                            <button onClick={()=>setStatus(cr.id,"approved")} style={{color:"#22c55e",fontWeight:500,fontSize:13,background:"transparent",border:"none",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",transition:"all 0.15s"}} onMouseEnter={e=>e.currentTarget.style.background="rgba(34,197,94,0.1)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>✓ Approve</button>
                            <button onClick={()=>setStatus(cr.id,"rejected")} style={{color:"#ef4444",fontWeight:500,fontSize:13,background:"transparent",border:"none",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",transition:"all 0.15s"}} onMouseEnter={e=>e.currentTarget.style.background="rgba(239,68,68,0.1)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>✕ Reject</button>
                          </>}
                          <button onClick={()=>setModal(`cr_${cr.id}`)} style={{color:"rgba(255,255,255,0.5)",fontSize:13,background:"transparent",border:"none",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",transition:"all 0.15s"}} onMouseEnter={e=>e.currentTarget.style.background="rgba(255,255,255,0.05)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>💬 Comments{(cr.comments||[]).length>0&&<span style={{marginLeft:3}}>{(cr.comments||[]).length}</span>}</button>
                        </div>
                      </div>
                    </div>
                  );
                })}
                {!fcrs.length&&(
                  <div className="card" style={{padding:"32px 24px",textAlign:"center",color:"var(--muted)"}}>
                    {filter!=="all"?(
                      <div>
                        <div style={{fontSize:28,marginBottom:8,display:"flex",justifyContent:"center"}}>{filter==="approved"?<Icon name="Check" size={28} color="var(--green)"/>:filter==="rejected"?<Icon name="X" size={28} color="var(--red)"/>:<Icon name="Clock" size={28} color="var(--amber)"/>}</div>
                        <div style={{fontWeight:700,fontSize:13,marginBottom:4,color:"var(--text)"}}>No {filter} Change Requests</div>
                        <p style={{fontSize:11,color:"var(--muted2)",lineHeight:1.6,marginBottom:10}}>
                          {filter==="approved"?"Approve a pending Change Request to see it here.":filter==="rejected"?"Rejected Change Requests will appear here with the reason.":"All Change Requests have been reviewed — nothing is waiting for your decision."}
                        </p>
                        <button onClick={()=>setFilter("all")} style={{background:"none",border:"none",color:"var(--primary)",cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif"}}>← Show all Change Requests</button>
                      </div>
                    ):(
                      <div>
                        <div style={{fontSize:28,marginBottom:8}}>📋</div>
                        <div style={{fontWeight:600,fontSize:13,marginBottom:4,color:"var(--text)"}}>No Change Requests yet</div>
                        <p style={{fontSize:11,color:"var(--muted2)",lineHeight:1.5,marginBottom:14}}>Log extra work your client asks for outside the original scope.</p>
                        <button className="btn-p" style={{fontSize:11,padding:"8px 18px"}} onClick={()=>setView("ncr")}>+ Log First CR</button>
                      </div>
                    )}
                  </div>
                )}
              </div>

              {/* ── ACTIVITY FEED + PROJECT SUMMARY ── */}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginTop:20,marginBottom:8}} className="stack-mobile">

                {/* Recent Activity */}
                <div className="card" style={{padding:"16px 20px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                    <div>
                      <h3 style={{fontSize:12,fontWeight:600,color:"var(--text)",letterSpacing:"0.02em",marginBottom:2}}>Activity</h3>
                      <p style={{fontSize:10,color:"var(--muted)",margin:0}}>Recent change requests</p>
                    </div>
                    <button className="btn-g" style={{fontSize:10,padding:"3px 10px"}} onClick={()=>setModal("audit")}>View All</button>
                  </div>
                  {(()=>{
                    const recentCRs=[...crs].sort((a,b)=>new Date(b.created_at||b.createdAt||0)-new Date(a.created_at||a.createdAt||0)).slice(0,5);
                    if(!recentCRs.length) return(
                      <div style={{textAlign:"center",padding:"20px 0"}}>
                        <div style={{fontSize:28,marginBottom:6,opacity:0.4}}>📋</div>
                        <p style={{fontSize:11,color:"var(--muted2)",lineHeight:1.6}}>No activity yet. Change Requests will appear here as they're submitted.</p>
                      </div>
                    );
                    const colors={approved:"var(--green)",pending:"var(--amber)",rejected:"var(--red)"};
                    const icons={approved:"Check",pending:"Clock",rejected:"X"};
                    return(
                      <div style={{display:"grid",gap:0}}>
                        {recentCRs.map((cr,i)=>(
                          <div key={cr.id} style={{display:"flex",gap:10,alignItems:"flex-start",paddingBottom:10,marginBottom:10,borderBottom:i<recentCRs.length-1?"1px solid var(--border)":"none"}}>
                            <div style={{width:28,height:28,borderRadius:"50%",background:`${colors[cr.status]||"#6366F1"}15`,border:`1px solid ${colors[cr.status]||"#6366F1"}30`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,flexShrink:0,marginTop:1}}>
                              {cr.status==="approved"?<Icon name="Check" size={14} color="var(--green)"/>:cr.status==="rejected"?<Icon name="X" size={14} color="var(--red)"/>:<Icon name="Clock" size={14} color="var(--amber)"/>}
                            </div>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{fontSize:12,color:"var(--text)",lineHeight:1.4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"100%"}} title={cr.description}>
                                {cr.description}
                              </div>
                              <div style={{display:"flex",gap:8,marginTop:3,flexWrap:"wrap"}}>
                                <span style={{fontSize:10,color:colors[cr.status]||"var(--muted)",fontWeight:600}}>{cr.status?.toUpperCase()}</span>
                                <span style={{fontSize:10,color:"var(--muted2)"}}>by {cr.requestedBy||cr.requested_by}</span>
                                {(cr.hours||cr.charge)&&<span style={{fontSize:10,color:"var(--blue)"}}>{cr.hours?cr.hours+"h":""}{cr.hours&&cr.charge?" · ":""}{cr.charge?"+"+Number(cr.charge).toLocaleString()+" "+(proj?.client_currency||brand?.currency||"USD"):""}</span>}
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    );
                  })()}
                </div>

                {/* Project Summary */}
                <div className="card" style={{padding:"20px 22px"}}>
                  <div className="lbl" style={{marginBottom:14}}>Project Summary</div>
                  <div style={{display:"grid",gap:10}}>

                    {/* Completion ring */}
                    {crs.length>0&&(()=>{
                      const resolved=crs.filter(c=>c.status!=="pending").length;
                      const pct=Math.round((resolved/crs.length)*100);
                      const color=pct===100?"var(--green)":pct>60?"var(--teal)":"var(--amber)";
                      return(
                        <div style={{background:"var(--surface2)",borderRadius:10,padding:"12px 14px",display:"flex",alignItems:"center",gap:12}}>
                          <div style={{width:44,height:44,borderRadius:"50%",background:`${color}15`,border:`3px solid ${color}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:800,color,flexShrink:0}}>{pct}%</div>
                          <div>
                            <div style={{fontSize:12,fontWeight:600,color:"var(--text)",marginBottom:2}}>CR Resolution</div>
                            <div style={{fontSize:11,color:"var(--muted2)"}}>{resolved} of {crs.length} Change Request{crs.length!==1?"s":""} resolved</div>
                            <div style={{height:4,background:"var(--surface3)",borderRadius:4,overflow:"hidden",marginTop:5,width:140}}>
                              <div style={{height:"100%",width:`${pct}%`,background:color,borderRadius:4,transition:"width 0.4s"}}/>
                            </div>
                          </div>
                        </div>
                      );
                    })()}

                    {/* Key stats - card container */}
                    <div style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:12,padding:"20px 24px",display:"flex",gap:0}}>
                      {[
                        {label:"TOTAL CRS",value:crs.length,icon:"List",color:"var(--primary)"},
                        {label:"PENDING REVIEW",value:crs.filter(c=>c.status==="pending").length,icon:"Clock",color:crs.filter(c=>c.status==="pending").length>0?"var(--amber)":undefined},
                        {label:"ADDED HOURS",value:(crs.filter(c=>c.status==="approved").reduce((a,c)=>a+(Number(c.hours)||0),0))+"h",icon:"Clock",color:"var(--blue)"},
                        {label:"TOTAL CHARGED",value:(proj?.client_currency||brand?.currency||"USD")+" "+(crs.filter(c=>c.status==="approved").reduce((a,c)=>a+(Number(c.charge)||0),0)).toLocaleString(),icon:"Check",color:"var(--primary)"},
                      ].map((s,i,arr)=>(
                        <div key={i} style={{flex:1,display:"flex",flexDirection:"column",gap:4,borderRight:i<arr.length-1?"1px solid rgba(255,255,255,0.06)":"none",paddingRight:i<arr.length-1?16:0}}>
                          <span style={{fontSize:10,opacity:0.4,letterSpacing:"0.08em",color:"var(--muted)",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace"}}>{s.label}</span>
                          <span style={{fontSize:16,fontWeight:600,color:s.color||"var(--text)"}}>{s.value}</span>
                        </div>
                      ))}
                    </div>

                    {/* Quick actions */}
                    <div style={{display:"flex",gap:6,marginTop:4,flexWrap:"wrap"}}>
                      <button className="btn-g" style={{fontSize:11,flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:4}} onClick={()=>setModal("share")}><Icon name="Link" size={11}/> Share</button>
                      <button className="btn-g" style={{fontSize:11,flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:4}} onClick={()=>setModal("invoice")}><Icon name="Invoice" size={11}/> Invoice</button>
                      <button style={{fontSize:11,flex:1,padding:"8px",border:"1px solid rgba(124,58,237,0.6)",color:"#a78bfa",background:"transparent",borderRadius:8,cursor:"pointer",fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",fontWeight:600,transition:"all 0.15s"}} onClick={()=>setView("ncr")} onMouseEnter={e=>e.currentTarget.style.background="rgba(124,58,237,0.1)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>+ New CR</button>
                    </div>
                  </div>
                </div>
              </div>

              <div style={{marginTop:8,paddingTop:20,borderTop:"1px solid rgba(255,255,255,0.08)",display:"flex",gap:10,flexWrap:"wrap"}}>
                {/* PDF, CSV, Share, Activity Log: ghost style with opacity 0.7, border on hover only */}
                <button style={{fontSize:11,display:"flex",alignItems:"center",gap:4,background:"transparent",border:"1px solid transparent",color:"var(--text)",opacity:0.7,borderRadius:8,padding:"7px 12px",cursor:"pointer",fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",fontWeight:500,transition:"all 0.15s"}} onClick={exportPDF} onMouseEnter={e=>{e.currentTarget.style.opacity="1";e.currentTarget.style.borderColor="var(--border)";}} onMouseLeave={e=>{e.currentTarget.style.opacity="0.7";e.currentTarget.style.borderColor="transparent";}}><Icon name="File" size={12}/> PDF</button>
                <button style={{fontSize:11,display:"flex",alignItems:"center",gap:4,background:"transparent",border:"1px solid transparent",color:"var(--text)",opacity:0.7,borderRadius:8,padding:"7px 12px",cursor:"pointer",fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",fontWeight:500,transition:"all 0.15s"}} onClick={exportCSV} onMouseEnter={e=>{e.currentTarget.style.opacity="1";e.currentTarget.style.borderColor="var(--border)";}} onMouseLeave={e=>{e.currentTarget.style.opacity="0.7";e.currentTarget.style.borderColor="transparent";}}><Icon name="File" size={12}/> CSV</button>
                <button style={{fontSize:11,display:"flex",alignItems:"center",gap:4,background:"transparent",border:"1px solid rgba(124,58,237,0.5)",color:"#a78bfa",opacity:1,borderRadius:8,padding:"7px 12px",cursor:"pointer",fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",fontWeight:500,transition:"all 0.15s"}} onClick={()=>setModal("invoice")}><Icon name="Invoice" size={12}/> Invoice</button>
                <button style={{fontSize:11,display:"flex",alignItems:"center",gap:4,background:"transparent",border:"1px solid transparent",color:"var(--text)",opacity:0.7,borderRadius:8,padding:"7px 12px",cursor:"pointer",fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",fontWeight:500,transition:"all 0.15s"}} onClick={()=>setModal("share")} onMouseEnter={e=>{e.currentTarget.style.opacity="1";e.currentTarget.style.borderColor="var(--border)";}} onMouseLeave={e=>{e.currentTarget.style.opacity="0.7";e.currentTarget.style.borderColor="transparent";}}><Icon name="Link" size={12}/> Share</button>
                {/* Activity Log: ghost style with opacity 0.7, border on hover only */}
                <button style={{fontSize:11,display:"flex",alignItems:"center",gap:4,background:"transparent",border:"1px solid transparent",color:"var(--text)",opacity:0.7,borderRadius:8,padding:"7px 12px",cursor:"pointer",fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",fontWeight:500,transition:"all 0.15s"}} onClick={()=>setModal("audit")} onMouseEnter={e=>{e.currentTarget.style.opacity="1";e.currentTarget.style.borderColor="var(--border)";}} onMouseLeave={e=>{e.currentTarget.style.opacity="0.7";e.currentTarget.style.borderColor="transparent";}}><Icon name="List" size={12}/> Activity Log</button>
                <button onClick={()=>deleteProject(proj.id)}
                  style={{marginLeft:"auto",background:"transparent",color:"var(--red)",
                    border:"1px solid rgba(239,68,68,0.3)",padding:"7px 16px",
                    borderRadius:8,fontSize:11,cursor:"pointer",fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",
                    fontWeight:600,transition:"all 0.12s",display:"flex",alignItems:"center",gap:5}}
                  onMouseEnter={e=>{e.currentTarget.style.background="rgba(239,68,68,0.06)";e.currentTarget.style.borderColor="rgba(239,68,68,0.5)";}}
                  onMouseLeave={e=>{e.currentTarget.style.background="transparent";e.currentTarget.style.borderColor="rgba(239,68,68,0.3)";}}>
                  🗑 Delete Project
                </button>
              </div>
            </div>
          );
        })()}

        {/* ── NEW CHANGE REQUEST ── */}
        {view==="ncr"&&proj&&(
          <div className="fade" style={{maxWidth:900,margin:"0 auto"}}>
            <div style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"var(--muted)",marginBottom:16}}>
              <span onClick={()=>{setView("dash");setNcrErrors({});}} style={{cursor:"pointer",transition:"color 0.12s"}} onMouseEnter={e=>e.target.style.color="var(--primary)"} onMouseLeave={e=>e.target.style.color="var(--muted)"}>Dashboard</span>
              <span style={{opacity:0.4}}>›</span>
              <span onClick={()=>{setView("proj");setNcrErrors({});}} style={{cursor:"pointer",transition:"color 0.12s"}} onMouseEnter={e=>e.target.style.color="var(--primary)"} onMouseLeave={e=>e.target.style.color="var(--muted)"}>{proj.name}</span>
              <span style={{opacity:0.4}}>›</span>
              <span style={{color:"var(--text)",fontWeight:600}}>New Change Request</span>
            </div>
            {(()=>{
              let hasDraft=false;
              try{const d=localStorage.getItem("sl_ncr_draft_"+pid);if(d){const p=JSON.parse(d);hasDraft=!!(p.description);}}catch(e){}
              return hasDraft&&ncr.description?(
                <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:"rgba(14,165,233,0.06)",border:"1px solid rgba(14,165,233,0.2)",borderRadius:8,marginBottom:14,fontSize:12,color:"var(--teal)"}}>
                  <span>💾</span>
                  <span style={{flex:1}}>Draft restored — your unsaved change request is back.</span>
                  <button onClick={()=>{setNcr({description:"",impact:"Low",requestedBy:"",priority:"normal"});try{localStorage.removeItem("sl_ncr_draft_"+pid);}catch(e){}}} style={{background:"none",border:"none",color:"var(--muted)",cursor:"pointer",fontSize:11,fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif"}}>Discard</button>
                </div>
              ):null;
            })()}
            <h2 style={{...H,fontSize:22,marginBottom:5}}>Submit Change Request</h2>
            <p style={{color:"var(--muted)",fontSize:12,marginBottom:8}}>Project: <span style={{color:"var(--primary)",fontWeight:600}}>{proj.name}</span></p>
            <div style={{background:"rgba(124,58,237,0.04)",border:"1px solid rgba(124,58,237,0.12)",borderRadius:8,padding:"10px 14px",marginBottom:14,fontSize:12,color:"var(--muted2)",lineHeight:1.7,display:"flex",alignItems:"flex-start",gap:8}}>
              <Icon name="Info" size={14} color="var(--primary)"/><span> <strong>What is a Change Request?</strong> Any time a client asks for something that wasn't in the original scope — a new feature, a design change, extra pages — log it here instead of just saying yes in chat. This creates a paper trail and lets you bill for the extra work.</span>
            </div>

            {/* Progress indicator */}
            <div style={{background:"rgba(245,158,11,0.05)",border:"1px solid rgba(245,158,11,0.15)",borderRadius:10,padding:"14px 16px",marginBottom:18}}>
              <div style={{fontSize:11,color:"var(--amber)",fontWeight:700,marginBottom:12,display:"flex",alignItems:"center",gap:6}}><Icon name="Check" size={11} color="var(--amber)"/> Step 2 of 4 — Log this change request formally</div>
              <div style={{display:"flex",alignItems:"center",gap:0}}>
                {[
                  {n:1,label:"Scope Locked",done:true},
                  {n:2,label:"Log CR",active:true},
                  {n:3,label:"Approve"},
                  {n:4,label:"Invoice"}
                ].map((s,i)=>(
                  <React.Fragment key={i}>
                    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,flex:s.active?1.2:1}}>
                      <div style={{width:32,height:32,borderRadius:"50%",background:s.done?"var(--green)":s.active?"linear-gradient(135deg,var(--amber),var(--orange))":"var(--surface2)",border:s.done||s.active?"none":"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:s.done||s.active?14:11,fontWeight:700,color:s.done||s.active?"#fff":"var(--muted2)",boxShadow:s.active?"0 0 12px rgba(245,158,11,0.3)":"none",className:s.active?"ncr-step-active":""}}>
                        {s.done?<Icon name="Check" size={14} color="#fff"/>:s.n}
                      </div>
                      <div style={{fontSize:10,fontWeight:s.active?700:400,color:s.done?"var(--green)":s.active?"var(--amber)":"var(--muted2)",whiteSpace:"nowrap"}}>{s.label}</div>
                    </div>
                    {i<3&&<div style={{flex:1,height:2,background:s.done?"var(--green)":"var(--border)",margin:"0 4px",marginBottom:18,borderRadius:1}}/>}
                  </React.Fragment>
                ))}
              </div>
              <div style={{fontSize:11,color:"var(--muted2)",marginTop:10,lineHeight:1.6,padding:"8px 12px",background:"rgba(245,158,11,0.03)",borderRadius:6,display:"flex",alignItems:"center",gap:6}}><Icon name="Info" size={11} color="var(--amber)"/> Once submitted, go back to the project view to approve or reject this CR — every decision is timestamped permanently.</div>
            </div>

            <div className="card" style={{padding:"12px 16px",marginBottom:18,borderLeft:"3px solid var(--teal)"}}>
              <div className="lbl">Current Locked Scope</div>
              <div className="field-hint">The change request will be added ON TOP of this original scope.</div>
              <p style={{fontSize:11,color:"var(--muted)",lineHeight:1.6,marginTop:3}}>{proj.baseline||""}</p>
            </div>
            <div className="card" style={{padding:26}}>
              <div style={{display:"grid",gap:16}}>
                <div><div className="lbl">Quick Template <span style={{fontSize:10,color:"var(--muted2)",fontWeight:400,textTransform:"none",letterSpacing:0}}>(optional)</span></div>
                  <div className="field-hint">Start from a common request type to save time.</div>
                  <select value={crtpl} onChange={e=>{setCrtpl(e.target.value);if(e.target.value)setNcr(c=>({...c,description:e.target.value}));}}>
                    <option value="">— From scratch —</option>
                    {CRT.map(t=><option key={t}>{t}</option>)}
                  </select>
                </div>
                <div style={{height:1,background:"var(--border)"}}/>
                <div><div className="lbl">What is being requested? *</div>
                  <div className="field-hint">Describe the change clearly. Include what the client wants, why they want it, and how it differs from the original scope.</div>
                  {ncrErrors.description&&<div style={{display:"flex",gap:6,alignItems:"flex-start",padding:"8px 12px",background:"rgba(239,68,68,0.06)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:8,marginBottom:8}}><span style={{color:"var(--red)",fontSize:13}}>⚠</span><span style={{fontSize:12,color:"var(--red)",lineHeight:1.6}}>{ncrErrors.description}</span></div>}
                  <textarea style={{border:ncrErrors.description?"1px solid var(--red)":undefined}} placeholder="e.g. Add user authentication module with email login, Google OAuth, and password reset. Affects backend API and frontend login page." value={ncr.description} onChange={e=>{setNcr(c=>({...c,description:e.target.value}));if(ncrErrors.description)setNcrErrors(er=>({...er,description:""}))}}/></div>
                <div><div className="lbl">Scope Impact Level</div>
                  <div className="field-hint">How much does this change affect the original project scope and timeline?</div>
                  <select value={ncr.impact} onChange={e=>setNcr(c=>({...c,impact:e.target.value}))}>
                    <option value="Low">Low — Minor tweak, less than 2 hours</option>
                    <option value="Medium">Medium — Notable addition, 2–8 hours</option>
                    <option value="High">High — Major feature, 8–20 hours</option>
                    <option value="Very High">Very High — Significant overhaul, 20+ hours</option>
                  </select>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                  <div>
                    <div className="lbl">Additional Hours Needed</div>
                    <div className="field-hint">How many hours will this change take to implement? Used in invoice calculation.</div>
                    <input type="number" min="0" placeholder="e.g. 8" value={ncr.hours||""} onChange={e=>setNcr(c=>({...c,hours:e.target.value}))} style={{fontSize:13}}/>
                  </div>
                  <div>
                    <div className="lbl">Extra Charge ({proj?.client_currency||brand?.currency||"USD"})</div>
                    <div className="field-hint">How much extra will you bill the client for this change? Leave 0 if included at no cost.</div>
                    <input type="number" min="0" placeholder="e.g. 5000 (leave 0 if free)" value={ncr.charge||""} onChange={e=>setNcr(c=>({...c,charge:e.target.value}))} style={{fontSize:13}}/>
                  </div>
                </div>
                <div>
                  <div className="lbl">Priority Level</div>
                  <div className="field-hint">Is this urgent? Urgent CRs appear highlighted in red on the dashboard.</div>
                  <div style={{display:"flex",gap:8}}>
                    {["normal","urgent"].map(p=>(
                      <button key={p} onClick={()=>setNcr(c=>({...c,priority:p}))} style={{flex:1,padding:8,borderRadius:6,fontSize:11,fontWeight:700,border:`1px solid ${ncr.priority===p?p==="urgent"?"var(--red)":"var(--teal)":"var(--border)"}`,background:ncr.priority===p?p==="urgent"?"rgba(239,68,68,.1)":"rgba(124,58,237,.1)":"transparent",color:ncr.priority===p?p==="urgent"?"var(--red)":"var(--teal)":"var(--muted)"}}>
                        {p==="urgent"?"🔴 Urgent":"🟢 Normal"}
                      </button>
                    ))}
                  </div>
                </div>
                <div><div className="lbl">Requested By *</div>
                  <div className="field-hint">Who is asking for this change? e.g. "Client (Maria)" or "Design Team"</div>
                  {ncrErrors.requestedBy&&<div style={{display:"flex",gap:6,alignItems:"flex-start",padding:"8px 12px",background:"rgba(239,68,68,0.06)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:8,marginBottom:8}}><span style={{color:"var(--red)",fontSize:13}}>⚠</span><span style={{fontSize:12,color:"var(--red)",lineHeight:1.6}}>{ncrErrors.requestedBy}</span></div>}
                  <input placeholder="e.g. Client (Maria) or Design Team" value={ncr.requestedBy} onChange={e=>{setNcr(c=>({...c,requestedBy:e.target.value}));if(ncrErrors.requestedBy)setNcrErrors(er=>({...er,requestedBy:""}))}}/></div>
                <button className="btn-p" style={{padding:"11px",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",gap:6}} onClick={submitCR} title="Submit this Change Request for your review — you'll approve or reject it from the project view"><Icon name="List" size={14}/> Submit Change Request for Approval</button>
              </div>
            </div>
          </div>
        )}

        {view==="activity"&&<ActivityView projects={projects} setView={setView} setPid={setPid}/>}
        {view==="analytics"&&<AnalyticsView projects={projects} setView={setView} setModal={setModal} setPid={setPid} brand={brand}/>}
        {view==="settings"&&(
          <div className="fade">
            <div style={{marginBottom:24}}>
              <h2 style={{fontSize:20,fontWeight:700,marginBottom:6,display:"flex",alignItems:"center",gap:8}}><Icon name="Settings" size={20} color="var(--primary)"/> Settings</h2>
              <p style={{fontSize:13,color:"var(--muted)"}}>Manage your account and preferences</p>
            </div>
            <div style={{display:"grid",gap:16}}>
              <div className="card" style={{padding:24}}>
                <h3 style={{fontSize:15,fontWeight:600,marginBottom:16,display:"flex",alignItems:"center",gap:8}}><Icon name="Card" size={16} color="var(--teal)"/> Billing & Plans</h3>
                <BillingView plan={plan} setPlan={p=>{setPlan(p);notify(`✅ Switched to ${p} plan`);}} user={user} billing={billing} setBilling={setBilling} createCheckoutSession={createCheckoutSession} loadBillingHistory={loadBillingHistory} isDemoMode={isDemoMode} notify={notify} trialEndAt={window.__trialEndAt}/>
              </div>
              <div className="card" style={{padding:24}}>
                <h3 style={{fontSize:15,fontWeight:600,marginBottom:16,display:"flex",alignItems:"center",gap:8}}><Icon name="Palette" size={16} color="var(--primary)"/> Branding</h3>
                <BrandSettings brand={brand} setBrand={setBrand} onSave={async()=>{if(isConfigured&&user){const{error}=await supabase.from("user_profiles").upsert({user_id:user.id,brand,plan},{onConflict:"user_id"});if(error)return notify("❌ Failed to save.");}notify("✅ Branding saved!");}}/>
              </div>
            </div>
          </div>
        )}
        {(view==="billing"||view==="brand")&&setView("settings")}

      </div>{/* center-col */}
    </main>

      </div>{/* body-shell */}

      {/* Mobile footer nav */}
      {isMobile && (
        <div className="mobile-footer-nav">
          <button className={view==="dash"?"active":""} onClick={()=>setView("dash")}>
            <span>⊞</span><span>Dashboard</span>
          </button>
          <button className={view==="analytics"?"active":""} onClick={()=>setView("analytics")}>
            <span>📊</span><span>Analytics</span>
          </button>
        </div>
      )}

      </div>{/* end main-content */}
    </div></>
  );
}


function BillingView({plan,setPlan,user,billing,setBilling,createCheckoutSession,loadBillingHistory,isDemoMode,notify,trialEndAt}){
  const [billingTab,setBillingTab]=React.useState("plans");
  const [showAddCard,setShowAddCard]=React.useState(false);
  const [processing,setProcessing]=React.useState(false);
  const [cardNumber,setCardNumber]=React.useState("");
  const [cardExpiry,setCardExpiry]=React.useState("");
  const [cardCvc,setCardCvc]=React.useState("");
  const [billCycle,setBillCycle]=React.useState("monthly");
  const [openFaq,setOpenFaq]=React.useState(null);
  
  React.useEffect(()=>{loadBillingHistory();},[]);
  
  const plans=[
    {id:"free",name:"Free",price:"$0",period:"forever",features:["1 active project","Unlimited change requests","Approve/reject workflow","Scope drift dashboard"],color:"var(--muted)",badge:"",guarantee:""},
    {id:"pro",name:"Pro",price:"$9",period:" lifetime",features:["Up to 5 projects","All Free features","PDF & CSV export","Client share links","Invoice generator","Client comment threads","E-signature on baseline","Priority email support"],color:"#7c3aed",popular:true,priceId:"price_pro_monthly",badge:"⚡ FIRST 5 = LIFETIME",badgeColor:"#f59e0b",guarantee:"🔒 One-time payment, forever",priceAnnual:"$7",savings:"Only 5 spots left!"},
    {id:"biz",name:"Business",price:"$19",period:" one-time",features:["Unlimited projects","All Pro features","Team roles & permissions","Analytics dashboard","Priority support","Webhook integrations"],color:"var(--blue)",priceId:"price_biz_monthly",badge:"🚀 POWERFUL",guarantee:"🔒 30-day money-back",priceAnnual:"$15",savings:"Save 20%"},
  ];
  
  const paymentMethod=billing.paymentMethod||{type:"card",last4:"4242",brand:"Visa",expiry:"12/27"};
  
  const invoices=billing.invoices.length>0?billing.invoices:[
    {id:"INV-001",date:"2026-03-01",amount:9,status:"paid",plan:"Pro"},
    {id:"INV-002",date:"2026-02-01",amount:9,status:"paid",plan:"Pro"},
  ];
  
  const handleSubscribe=async(priceId)=>{
    if(isDemoMode){notify("Demo mode - upgrade works in real account");setPlan(priceId==="price_pro_monthly"?"pro":"biz");return;}
    if(!user){notify("Please sign in first");return;}
    // Get current trial status (with fallback for missing columns)
    let profile={trial_status:"none",payment_type:"none",is_lifetime:false};
    try{
      const{data}=await supabase.from("user_profiles").select("trial_status,payment_type,is_lifetime").eq("user_id",user.id).maybeSingle();
      if(data)profile=data;
    }catch(e){console.warn("Profile fetch error:",e);}
    // If no active subscription, offer trial
    if(!profile?.is_lifetime && profile?.payment_type !== 'one_time'){
      // Check if user can start trial
      if(profile?.trial_status === 'none' || profile?.trial_status === 'expired' || !profile){
        // Start 14-day trial
        setBilling(b=>({...b,loading:true}));
        try{
          const response=await fetch(`${API_BASE}/start-trial`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({userId:user.id})
          });
          const result=await response.json();
          if(result.error){throw new Error(result.error);}
          // Reload profile to get trial
          await loadUserProfile();
          notify("✅ 14-day Pro trial started! Complete your purchase anytime before it ends.");
        }catch(e){
          notify("❌ Error starting trial: "+e.message);
        }finally{
          setBilling(b=>({...b,loading:false}));
        }
        return;
      }
    }
    // User already has trial or subscription - go to checkout
    await createCheckoutSession(priceId);
  };
  
  const handleAddCard=async()=>{
    if(!cardNumber||!cardExpiry||!cardCvc){notify("Please fill all card fields");return;}
    setProcessing(true);
    setTimeout(()=>{
      setProcessing(false);
      setShowAddCard(false);
      setCardNumber("");
      setCardExpiry("");
      setCardCvc("");
      setBilling(b=>({...b,paymentMethod:{type:"card",last4:cardNumber.slice(-4)||"4242",brand:"Visa",expiry:cardExpiry}}));
      notify("Card added successfully");
    },1500);
  };
  
  const handleManageBilling=async()=>{
    if(isDemoMode){notify("Demo mode - billing portal in real account");return;}
    window.open("https://payhip.com/dashboard","_blank");
  };

  return(
    <div>
      <div style={{display:"flex",gap:4,marginBottom:20,background:"var(--surface2)",borderRadius:8,padding:4,width:"fit-content"}}>

          {id:"plans",label:"Plans"},
          {id:"payment",label:"Payment"},
          {id:"history",label:"Invoices"},
          {id:"cancel",label:"Cancel"},

          <button key={t.id} onClick={()=>setBillingTab(t.id)} style={{padding:"8px 14px",borderRadius:6,border:"none",borderBottom:billingTab===t.id?"2px solid #7c3aed":"2px solid transparent",background:billingTab===t.id?"var(--surface2)":"transparent",color:billingTab===t.id?"var(--text)":"var(--muted)",fontSize:11,fontWeight:billingTab===t.id?600:400,cursor:"pointer",display:"flex",alignItems:"center",gap:6,transition:"all 0.15s ease"}}>
            <span>{t.label}</span>
          </button>
        ))}
      </div>

      {billingTab==="plans"&&(
        <div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:24,flexWrap:"wrap",gap:12}}>
            <div style={{display:"flex",gap:4,background:"var(--surface2)",borderRadius:8,padding:3}}>
              <button onClick={()=>setBillCycle("monthly")} style={{padding:"6px 14px",borderRadius:6,border:"none",background:billCycle==="monthly"?"var(--surface)":"transparent",color:billCycle==="monthly"?"var(--text)":"var(--muted)",fontSize:11,fontWeight:600,cursor:"pointer"}}>Monthly</button>
              <button onClick={()=>setBillCycle("annual")} style={{padding:"6px 14px",borderRadius:6,border:"none",background:billCycle==="annual"?"var(--surface)":"transparent",color:billCycle==="annual"?"var(--text)":"var(--muted)",fontSize:11,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>Annual <span style={{background:"var(--green)",color:"#000",fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:4}}>Save 20%</span></button>
            </div>
            {billCycle==="annual"&&<div style={{fontSize:12,color:"var(--amber)"}}>20% discount applied!</div>}
          </div>
          
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:16}}>
            {plans.map(p=>{
              const displayPrice=billCycle==="annual"&&p.priceAnnual?p.priceAnnual:p.price;
              const isPro=p.id==="pro";
              return(
            <div key={p.id} style={{
              padding:"24px 18px",
              border:`1px solid ${isPro?"rgba(124,58,237,0.6)":plan===p.id?p.color:"var(--border)"}`,
              boxShadow:isPro?"0 0 32px rgba(124,58,237,0.15), 0 0 0 1px rgba(124,58,237,0.3)":"none",
              transform:isPro?"scale(1.03)":"scale(1)",
              position:"relative",
              background:plan===p.id?`${p.color}08`:"var(--surface)",
              transition:"all 0.2s ease",
            }}>
              {p.popular&&<div style={{
                position:"absolute",top:"-12px",left:"50%",transform:"translateX(-50%)",
                background:"linear-gradient(135deg, #7c3aed, #6d28d9)",
                color:"#fff",fontSize:10,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",
                padding:"3px 12px",borderRadius:999,whiteSpace:"nowrap"
              }}>{p.badge}</div>}
              <div className="lbl" style={{color:p.color}}>{p.name}</div>
              <div style={{fontSize:32,fontWeight:800,lineHeight:1,marginBottom:2}}><span style={{color:p.color}}>{displayPrice}</span><span style={{fontSize:12,fontWeight:400,color:"var(--muted)"}}>{p.period}</span></div>
              {p.savings&&<div style={{fontSize:10,color:"var(--green)",marginBottom:8}}>{p.savings}</div>}
              <ul style={{listStyle:"none",margin:"14px 0",display:"grid",gap:8}}>
                {p.features.map(f=><li key={f} style={{fontSize:13,display:"flex",gap:8,alignItems:"flex-start",marginBottom:8}}><span style={{color:"#22c55e",fontSize:12,flexShrink:0}}>✓</span><span style={{color:"var(--text)"}}>{f}</span></li>)}
              </ul>
              {p.id==="free"?plan===p.id?<div style={{background:"rgba(34,197,94,0.08)",border:"1px solid rgba(34,197,94,0.25)",color:"#22c55e",borderRadius:8,padding:10,textAlign:"center",fontSize:13,fontWeight:500}}>✓ Current Plan</div>:<button onClick={()=>setPlan("free")} className="btn-g" style={{width:"100%",padding:10,fontSize:11}}>Go Free</button>:
              <button onClick={()=>handleSubscribe(p.priceId)} className={(plan===p.id || trialEndAt)?"btn-g":"btn-p"} style={{width:"100%",padding:10,fontSize:11}} disabled={billing.loading}>
                {billing.loading?"Loading...":trialEndAt?`Active (${Math.ceil((new Date(trialEndAt)-new Date())/(864e5))} days left)`:plan===p.id?"✓ Active":p.id==="pro"?"Start 14-Day Pro Trial":"Go Business"}
              </button>}
            </div>)})}
          </div>
          
{billCycle==="monthly"&&<div style={{marginTop:20,padding:"14px 20px",background:"rgba(245,158,11,0.08)",border:"1px solid rgba(245,158,11,0.25)",borderLeft:"3px solid #f59e0b",borderRadius:10}}>
            <div style={{fontSize:13,fontWeight:600,color:"#f59e0b",marginBottom:4}}>🎉 First 5 Subscribers = Lifetime Access</div>
            <div style={{fontSize:12,color:"var(--muted)"}}>Be among the first 5 to subscribe and get Pro forever — one payment, never pay again.</div>
          </div>}
          <div style={{marginTop:28}}>
            <div style={{fontSize:12,fontWeight:600,marginBottom:12}}>Frequently Asked Questions</div>
            <div style={{textAlign:"left",maxWidth:500}}>
              {[
                {q:"Can I cancel anytime?",a:"Yes, no questions asked. Cancel from settings anytime."},
                {q:"What if I need more projects?",a:"Upgrade anytime. Your data is preserved."},
                {q:"Is there a money-back guarantee?",a:"Yes! We honor every guarantee — no questions asked, no fine print."},
              ].map((faq,i)=>(
                <div key={i}>
                  <div onClick={()=>setOpenFaq(openFaq===i?null:i)} style={{padding:"16px 0",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
                    <span style={{fontWeight:600,fontSize:14,color:"var(--text)"}}>{faq.q}</span>
                    <span style={{color:"var(--muted)",transition:"transform 0.2s ease",transform:openFaq===i?"rotate(180deg)":"rotate(0deg)"}}>▾</span>
                  </div>
                  {openFaq===i&&<div style={{fontSize:13,color:"var(--muted)",padding:"0 0 16px 0"}}>{faq.a}</div>}
                </div>
              ))}
            </div>
          </div>
          
          {/* Trust Banner */}
          <div style={{marginTop:24,padding:"20px 24px",background:"rgba(34,197,94,0.05)",border:"1px solid rgba(34,197,94,0.15)",borderRadius:12}}>
            <div style={{fontSize:12,letterSpacing:"0.1em",textTransform:"uppercase",color:"#22c55e",fontWeight:600,marginBottom:12}}>Risk-Free Guarantee</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {["14-day free trial","No credit card required","Cancel anytime","30-day money-back refund"].map(item=>(
                <div key={item} style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:"var(--text)"}}>
                  <span style={{color:"#22c55e"}}>✓</span>{item}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {billingTab==="payment"&&(
        <div className="card" style={{padding:20,maxWidth:500}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
            <div style={{fontWeight:600,fontSize:14}}>Payment Method</div>
            {!isDemoMode&&<button className="btn-p" style={{fontSize:10,padding:"5px 12px"}} onClick={()=>setShowAddCard(true)}>+ Add Card</button>}
          </div>
          {(paymentMethod||isDemoMode)&&(
            <div style={{display:"flex",alignItems:"center",gap:12,padding:14,background:"var(--surface2)",borderRadius:8,border:"1px solid var(--border)"}}>
              <div style={{width:44,height:28,background:"linear-gradient(135deg,#1a1f36,#2d3748)",borderRadius:5,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:"#fff"}}>VISA</div>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:13}}>•••• •••• •••• {paymentMethod.last4}</div>
                <div style={{fontSize:10,color:"var(--muted)"}}>Expires {paymentMethod.expiry}</div>
              </div>
            </div>
          )}
          {isDemoMode&&(
            <div style={{marginTop:14,padding:12,background:"var(--surface2)",borderRadius:8,fontSize:11,color:"var(--muted)"}}>
              💳 Demo mode - Payment management available in real accounts
            </div>
          )}
        </div>
      )}

      {billingTab==="history"&&(
        <div className="card" style={{padding:0,overflow:"hidden",maxWidth:600}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead>
              <tr style={{background:"var(--surface2)"}}>
                <th style={{textAlign:"left",padding:"10px 14px",fontSize:10,textTransform:"uppercase",letterSpacing:"0.05em",color:"var(--muted)"}}>Invoice</th>
                <th style={{textAlign:"left",padding:"10px 14px",fontSize:10,textTransform:"uppercase",letterSpacing:"0.05em",color:"var(--muted)"}}>Date</th>
                <th style={{textAlign:"right",padding:"10px 14px",fontSize:10,textTransform:"uppercase",letterSpacing:"0.05em",color:"var(--muted)"}}>Amount</th>
                <th style={{textAlign:"right",padding:"10px 14px",fontSize:10,textTransform:"uppercase",letterSpacing:"0.05em",color:"var(--muted)"}}>Status</th>
              </tr>
            </thead>
            <tbody>
              {invoices.map(inv=>(
                <tr key={inv.id} style={{borderTop:"1px solid var(--border)"}}>
                  <td style={{padding:"12px 14px",fontWeight:600,fontSize:11}}>{inv.id}</td>
                  <td style={{padding:"12px 14px",fontSize:11,color:"var(--muted)"}}>{inv.date}</td>
                  <td style={{padding:"12px 14px",fontSize:11,textAlign:"right",fontWeight:600}}>${inv.amount}</td>
                  <td style={{padding:"12px 14px",textAlign:"right"}}>
                    <span style={{fontSize:9,fontWeight:600,padding:"2px 8px",borderRadius:10,background:"rgba(16,185,129,0.1)",color:"var(--green)"}}>{inv.status.toUpperCase()}</span>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {billingTab==="cancel"&&(
        <div className="card" style={{padding:24,maxWidth:500}}>
          <div style={{textAlign:"center",marginBottom:20}}>
            <div style={{fontSize:32,marginBottom:12}}>😢</div>
            <div style={{fontWeight:600,fontSize:16,marginBottom:8}}>We're sorry to see you go</div>
            <div style={{fontSize:13,color:"var(--muted)"}}>You can cancel your subscription anytime. Your access will continue until the end of your billing period.</div>
          </div>
          
          {plan==="free"?(
            <div style={{padding:16,background:"var(--surface2)",borderRadius:10,textAlign:"center",fontSize:13}}>
              You are currently on the free plan. No action needed.
            </div>
          ):(
            <div>
              <div style={{padding:16,background:"rgba(245,158,11,0.08)",border:"1px solid rgba(245,158,11,0.25)",borderRadius:10,marginBottom:16}}>
                <div style={{fontWeight:600,fontSize:13,color:"#f59e0b",marginBottom:4}}>Before you go</div>
                <div style={{fontSize:12,color:"var(--muted)"}}>Need help? Email support@scopelock.com and we'll happy to assist.</div>
              </div>
              <div style={{fontSize:13,marginBottom:16,color:"rgba(255,255,255,0.7)"}}>

                <ol style={{margin:"8px 0",paddingLeft:20,color:"var(--muted)"}}>
                  <li>Go to your PayHip account</li>
                  <li>Find your subscription</li>
                  <li>Click Cancel</li>
                </ol>
              </div>
              <a href="https://payhip.com/dashboard" target="_blank" rel="noopener noreferrer" className="btn-g" style={{display:"block",textAlign:"center",padding:12,width:"100%",boxSizing:"border-box",textDecoration:"none"}}>
                Cancel on PayHip Dashboard →
              </a>
              <div style={{fontSize:10,color:"var(--muted)",textAlign:"center",marginTop:12}}>
                Or contact support@scopelock.com for assistance
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}


function BrandSettings({brand,setBrand,onSave}){
  const [logo,setLogo]=React.useState(brand?.logo||"");
  const [company,setCompany]=React.useState(brand?.company||"");
  const [email,setEmail]=React.useState(brand?.email||"");
  const [phone,setPhone]=React.useState(brand?.phone||"");
  const [address,setAddress]=React.useState(brand?.address||"");
  const [currency,setCurrency]=React.useState(brand?.currency||"USD");

  React.useEffect(()=>{
    setLogo(brand?.logo||"");
    setCompany(brand?.company||"");
    setEmail(brand?.email||"");
    setPhone(brand?.phone||"");
    setAddress(brand?.address||"");
    setCurrency(brand?.currency||"USD");
  },[brand]);

  const handleSave=()=>{
    setBrand({logo,company,email,phone,address,currency});
    onSave?.();
  };

  return(
    <div style={{display:"grid",gap:16}}>
      <div>
        <div className="lbl" style={{marginBottom:8}}>Company Logo / Icon</div>
        <div style={{border:"2px dashed var(--border)",borderRadius:12,padding:24,textAlign:"center",background:"var(--surface2)"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:12}}>
            <div style={{width:48,height:48,borderRadius:10,background:"var(--surface2)",border:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden"}}>{logo && logo.startsWith("http")?<img src={logo} alt="Logo" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:logo && logo !== "🔒"?<span style={{fontSize:24}}>{logo}</span>:<Lock size={24} color="var(--muted)" />}</div>
            <input placeholder="Icon or emoji" value={logo} onChange={e=>setLogo(e.target.value)} style={{flex:1,maxWidth:200,background:"var(--surface)",border:"1px solid var(--border)",borderRadius:8,padding:"8px 12px",color:"var(--text)",fontSize:13}}/>
          </div>
          <div style={{fontSize:11,opacity:0.4,marginTop:12}}>PNG, SVG recommended · Max 2MB</div>
        </div>
      </div>
      <div>
        <div className="lbl">Company Name</div>
        <input placeholder="Your Company Name" value={company} onChange={e=>setCompany(e.target.value)} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:8,padding:"8px 12px",color:"var(--text)",fontSize:13,width:"100%",boxSizing:"border-box"}}/>
      </div>
      <div>
        <div className="lbl">Business Email</div>
        <input type="email" placeholder="hello@company.com" value={email} onChange={e=>setEmail(e.target.value)} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:8,padding:"8px 12px",color:"var(--text)",fontSize:13,width:"100%",boxSizing:"border-box"}}/>
      </div>

function ActivityView({projects,setView,setPid}){
  const allCRs=projects.flatMap(p=>p.changeRequests||[]);
  
  const getTimeAgo=(dateStr)=>{
    const diff=Date.now()-new Date(dateStr).getTime();
    const mins=Math.floor(diff/60000);
    const hours=Math.floor(mins/60);
    const days=Math.floor(hours/24);
    if(mins<1) return"just now";
    if(mins<60) return`${mins}m ago`;
    if(hours<24) return`${hours}h ago`;
    if(days<7) return`${days}d ago`;
    return new Date(dateStr).toLocaleDateString();
  };
  
  const timelineItems=[...projects.map(p=>({
    type:"project",
    icon:"📁",
    title:`Project: ${p.name}`,
    subtitle:p.client||"Internal",
    date:p.createdAt||p.created_at,
    color:"var(--teal)"
  })),...allCRs.map(cr=>{
    const proj=projects.find(p=>p.id===cr.project_id)||projects.find(p=>p.changeRequests?.some(c=>c.id===cr.id));
    return{
      type:"cr",
      icon:{pending:"📋",approved:"✓",rejected:"✕"}[cr.status]||"📋",
      title:cr.title||cr.description?.slice(0,50)||"Change Request",
      subtitle:cr.requestedBy?"by "+cr.requestedBy:"",
      date:cr.created_at||cr.createdAt,
      status:cr.status,
      project:proj?.name||"Unknown",
      color:cr.status==="approved"?"var(--green)":cr.status==="rejected"?"var(--red)":"var(--amber)"
    };
  })].sort((a,b)=>new Date(b.date)-new Date(a.date));

  if(projects.length===0){
    return(
      <div className="fade" style={{textAlign:"center",padding:"60px 20px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"calc(100vh - 120px)"}}>
        <div style={{width:80,height:80,background:"linear-gradient(135deg, #ede9fe, #ddd6fe)",borderRadius:20,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:16}}>
